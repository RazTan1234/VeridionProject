[project]
name = "techdetect"
version = "0.1.0"
description = "Evidence-backed website technology detection"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "pyarrow>=20",
    "pydantic>=2.9",
    "pyyaml>=6",
    "dnspython>=2.7",
    "selectolax>=0.3",
]

[project.optional-dependencies]
browser = ["playwright>=1.48"]
dev = ["pytest>=8"]

[project.scripts]
techdetect = "techdetect.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
